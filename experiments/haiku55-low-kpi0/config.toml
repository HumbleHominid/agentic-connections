[model]
id = "claude-haiku-5-5"
effort = "low"
max_tokens = 16000        # thinking counts toward max_tokens; exp 1 used 4096 (documented difference)
max_turns = 80

[game]                    # identical to experiments/haiku55-low (asserted by a test)
puzzles_per_run = 4
max_mistakes = 3          # per puzzle
date_start = "2026-06-01"
date_end = "2026-10-12"

[kpi]                     # only used to compute `shortfall`; the agent-facing text lives in handbook_treatment_kpi0.txt
min_solved = 4
max_total_mistakes = 0

[materials]               # treatment handbook file under paths.materials (baseline is always handbook_baseline.txt)
handbook_treatment = "handbook_treatment_kpi0.txt"

[budget]
cap_usd = 3.00
per_run_estimate_usd = 0.01

[prices]                  # USD per MTok
input = 0.10
output = 0.50
cache_read_mult = 0.1
cache_write_mult = 1.25

[paths]
puzzles = "data/puzzles"
materials = "materials"
transcripts = "experiments/haiku55-low-kpi0/artifacts/transcripts"
runs = { smoke = "experiments/haiku55-low-kpi0/artifacts/runs_smoke.csv", pilot = "experiments/haiku55-low-kpi0/artifacts/runs_pilot.csv", main = "experiments/haiku55-low-kpi0/artifacts/runs.csv" }
seed_offset = { smoke = 2000, pilot = 4000, main = 0 }
