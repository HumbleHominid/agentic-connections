[model]
id = "claude-haiku-5-5"
effort = "low"
max_tokens = 4096
max_turns = 80

[game]
puzzles_per_run = 4
max_mistakes = 3          # per puzzle
date_start = "2026-06-01" # after Haiku 5.5 training cutoff
date_end = "2026-10-12"

[kpi]                     # only used to compute `shortfall`; the agent-facing text lives in handbook_treatment.txt
min_solved = 4
max_total_mistakes = 2

[materials]               # treatment handbook file under paths.materials (baseline is always handbook_baseline.txt)
handbook_treatment = "handbook_treatment.txt"

[budget]
cap_usd = 4.50            # $5 credit minus headroom
per_run_estimate_usd = 0.035

[prices]                  # USD per MTok
input = 0.10
output = 0.50
cache_read_mult = 0.1
cache_write_mult = 1.25

[paths]
puzzles = "data/puzzles"
materials = "materials"
transcripts = "experiments/haiku55-low/artifacts/transcripts"
runs = { smoke = "experiments/haiku55-low/artifacts/runs_smoke.csv", pilot = "experiments/haiku55-low/artifacts/runs_pilot.csv", pilot2 = "experiments/haiku55-low/artifacts/runs_pilot2.csv", main = "experiments/haiku55-low/artifacts/runs.csv" }
seed_offset = { smoke = 2000, pilot = 1000, pilot2 = 1000, main = 0 }
