[project]
name = "connections-redteam"
version = "0.1.0"
description = "KPI pressure and misreporting in a Connections-playing LLM agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "connections_redteam"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
